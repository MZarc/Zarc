[workspace]
resolver = "2"
members = ["crates/zarc-core", "crates/zarc-jni"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
zarc-core = { path = "crates/zarc-core" }
thiserror = "2.0"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
